<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="My location">
  <title>My Location</title>
  <defs>
    <linearGradient id="ml-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <mask id="ml-pin-hole">
      <rect width="64" height="64" fill="#000"/>
      <path d="M32 12c-7.7 0-14 6.2-14 13.9 0 9.9 12.1 22.7 13.2 23.8a1.2 1.2 0 0 0 1.7 0C34 48.6 46 35.8 46 25.9 46 18.2 39.7 12 32 12z" fill="#fff"/>
      <circle cx="32" cy="25.6" r="5.2" fill="#000"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#ml-bg)"/>

  <!-- ground shadow under the pin -->
  <ellipse cx="32" cy="52" rx="10" ry="3.2" fill="#022c22" opacity="0.28"/>

  <!-- pin: the hole is masked out so the background shows through -->
  <rect width="64" height="64" fill="#ffffff" mask="url(#ml-pin-hole)"/>
</svg>
